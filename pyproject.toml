[project]
name = "mateon-ai"
version = "0.1.0"
description = "AI server for Mate-On"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "tenacity>=9.0",
    "python-multipart>=0.0.32",
    "pymupdf>=1.28.0",
    "supabase>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "streamlit>=1.38",
    # scripts/generate_contest_graph_visualization.py의 PCA/UMAP 계산용 — 프로덕션 앱 코드에서는
    # 쓰지 않는다. umap-learn은 PCA로 100차원까지 줄인 뒤 이웃 관계를 보존하며 2차원으로 축소하는
    # 용도(2026-08-20 추가 — 순수 PCA만으로는 "비슷한 장르끼리 가깝게"가 전혀 안 됨을 실측 확인,
    # CLAUDE.md "그래프형 시각화" 참고).
    "numpy>=1.26",
    "umap-learn>=0.5",
    # scikit-learn은 umap-learn의 하위 의존성으로 이미 딸려온다 — 클러스터 가중치 ML 사전 구축
    # 실험(scripts/train_cluster_weight_ml_pretrain.py, 로지스틱 회귀)에도 재사용. matplotlib은
    # 그 실험 결과를 로컬 전용으로 시각화하는 용도(2026-08-21).
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that call the real OpenAI API (excluded by default)",
]
addopts = "-m 'not live'"
