[project]
name = "mateon-ai"
version = "0.1.0"
description = "AI server for Mate-On"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "tenacity>=9.0",
    "python-multipart>=0.0.32",
    "pymupdf>=1.28.0",
    "supabase>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "streamlit>=1.38",
    # numpy는 클러스터 가중치 ML 사전 구축 실험(scripts/train_cluster_weight_ml_pretrain.py 등)의
    # 배열 연산용. scikit-learn은 그 실험의 로지스틱 회귀 학습(app/evaluation/ml_pretrain.py)에
    # 직접 쓴다 — 2026-08-23까지는 umap-learn의 하위 의존성으로 딸려 들어왔지만, 공모전 그래프
    # 시각화(scripts/generate_contest_graph_visualization.py)가 실제 임베딩+PCA/UMAP 대신 장르별
    # 고정 앵커+가우시안 지터로 좌표를 합성하는 방식으로 바뀌면서 umap-learn 자체가 더 이상 이
    # 저장소 어디서도 안 쓰여 제거했다 — 그래서 scikit-learn을 직접 의존성으로 명시했다(제거만
    # 하고 안 챙기면 uv sync 때 조용히 같이 빠져서 ML 사전 구축 스크립트가 깨진다).
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # matplotlib은 ML 사전 구축 실험 결과를 로컬 전용으로 시각화하는 용도(2026-08-21).
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that call the real OpenAI API (excluded by default)",
]
addopts = "-m 'not live'"
